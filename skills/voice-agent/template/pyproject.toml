[project]
name = "voice-agent-cli"
version = "0.1.0"
description = "Local terminal voice agent — Pipecat LocalAudioTransport, 'over' turn trigger, self-echo mute filter"
requires-python = ">=3.10"
dependencies = [
    "loguru>=0.7.2",
    "python-dotenv>=1.0.0",
    "pipecat-ai[cartesia,deepgram,openai,silero,local]==0.0.100",
]

[project.optional-dependencies]
dev = ["ruff>=0.12.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
